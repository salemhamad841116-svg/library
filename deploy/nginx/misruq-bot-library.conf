# ==============================================================================
# Nginx Configuration for Misruq Unified Architecture
# Domains:
#   1) bot.misruq.com         -> Public Bot Interface (Isolated, No Admin, No Auth required)
#   2) library.misruq.com     -> Books & Notes App + Unified Admin Panel
#   3) library-mgt.misruq.com -> Management Alias (Admin & Books)
# ==============================================================================

# Upstream Node.js Express server running on port 3002
upstream misruq_backend {
    server 127.0.0.1:3002;
    keepalive 64;
}

# ------------------------------------------------------------------------------
# 1. PUBLIC BOT DOMAIN: bot.misruq.com
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name bot.misruq.com;

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bot.misruq.com;

    # SSL Certificates (managed via Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/bot.misruq.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.misruq.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(self), camera=(self)" always;

    # Client body limit for audio/image uploads
    client_max_body_size 50M;

    # Defense-in-depth: Strict block of ALL admin endpoints on the public bot domain
    location ~* ^/(api/bot/admin|api/admin|admin) {
        return 404;
    }

    # Public Bot API Endpoints (Chat, Voice, Audio, Uploads, Config)
    location /api/bot/ {
        proxy_pass http://misruq_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # SPA Bot Frontend & Static Assets
    location / {
        proxy_pass http://misruq_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for Vite HMR in dev and live updates)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ------------------------------------------------------------------------------
# 2. BOOKS & UNIFIED ADMIN DOMAIN: library.misruq.com / library-mgt.misruq.com
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name library.misruq.com library-mgt.misruq.com;

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name library.misruq.com library-mgt.misruq.com;

    # SSL Certificates (managed via Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/library.misruq.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/library.misruq.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Max upload size for attachments and notes backups
    client_max_body_size 100M;

    # Live SSE Stream for Bot Chat Logs (Streaming Real-time Support)
    location /api/bot/admin/chat-logs/stream {
        proxy_pass http://misruq_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE Required Proxy Buffering Settings
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        chunked_transfer_encoding on;
    }

    # API routes (Books, Notes, Admin, Bot Admin)
    location /api/ {
        proxy_pass http://misruq_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # Books App Frontend & Static Assets
    location / {
        proxy_pass http://misruq_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
